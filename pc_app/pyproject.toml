[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-window-controller"
version = "0.1.0"
description = "PC control application for the smart rotating-window prototype"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.10",
]

[project.scripts]
smart-window = "smart_window.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ui_smoke.py" = ["E402"]

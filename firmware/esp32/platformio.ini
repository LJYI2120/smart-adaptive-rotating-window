[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  -DCORE_DEBUG_LEVEL=0
test_filter = native_protocol

[env:native_protocol]
platform = native
test_filter = native_protocol
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
  -Werror
lib_deps =
